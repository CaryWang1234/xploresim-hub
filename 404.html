<!DOCTYPE html>

<head>

<title>404 · XploreSim</title>

<style>
:root { --bg:#0b1017; --text:#e6edf7; --dim:#8ea0bb; --faint:#6a7b95; --line:#26313f; --accent:#ffd94a;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:40px 20px;
  font-family:var(--sans); color:var(--text);
  background: radial-gradient(900px 460px at 50% -10%, #1a2534 0%, var(--bg) 65%) var(--bg); }
main { max-width:560px; text-align:center; }
p.mono { font-family:var(--mono); font-size:12px; letter-spacing:.28em; color:var(--faint); margin:0; }
h1 { font-family:var(--mono); font-size:64px; margin:12px 0 0; letter-spacing:-.02em; color:var(--accent); }
p { color:var(--dim); margin:14px 0 0; line-height:1.65; }
ul { list-style:none; margin:26px 0 0; padding:0; display:grid; gap:10px; }
a { display:block; text-decoration:none; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  color:var(--text); font-size:14px; transition:border-color .2s, transform .2s; }
a:hover { border-color:var(--accent); transform:translateY(-2px); }
a span { font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.1em; margin-left:8px; }
</style>
</head>

  </ul>
</main>
</body>
</html>
